[package]
name = "firebirddelta"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Stream a live Firebird database incrementally into Delta Lake tables"
license = "MIT"
publish = false

[lib]
name = "firebirddelta"
path = "src/lib.rs"
# cdylib for the Python extension module; rlib so the crate's own tests can link it.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Python bindings. abi3-py310 builds one wheel that loads on CPython 3.10 and later.
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }

# Pure-Rust Firebird wire-protocol client: no fbclient driver install, at the cost of a
# synchronous API (see src/connect.rs) and the coarse SqlType/type-coercion limitations
# CLAUDE.md's Driver notes document in detail. default-features = false, features =
# ["pure_rust"] excludes the "linking"/"dynamic_loading" backends, which link against the
# official native fbclient library and would reintroduce the deployment-time driver
# install this crate exists to avoid.
#
# Pinned to =0.27.0, not the newest 0.28.0: probed directly (2026-09), 0.28.0's
# `rsfbclient-rust` fails to compile on stable Rust at all. Its `wire.rs` uses an
# `if let ... && let ...` match-arm *guard* (distinct from, and still unstable unlike,
# the let-chains stabilised for plain `if`/`while` expressions), which needs nightly's
# `if_let_guard` feature: `rustc --explain E0658`. 0.27.0's `rsfbclient-core` and
# `rsfbclient` (row/query/builder APIs) are byte-identical to 0.28.0's (diffed directly),
# so this is a pure version pin, not a capability trade-off. Revisit once a released
# version fixes that guard on stable.
rsfbclient = { version = "=0.27.0", default-features = false, features = ["pure_rust"] }
# `rsfbclient` never re-exports its own `pure_rust` backend's concrete client type
# (`RustFbClient`) from its crate root, only from the separate `rsfbclient-rust` crate it
# depends on internally; naming `crate::connect::FbConnection`'s type parameter needs it
# directly. Pinned to the same version for the same reason as `rsfbclient` above.
rsfbclient-rust = "=0.27.0"

# Named directly by builders.rs and types.rs, converting rsfbclient's decoded temporal
# values (all three of DATE/TIME/TIMESTAMP arrive as the same chrono::NaiveDateTime; see
# CLAUDE.md) into the epoch-relative integers Arrow stores.
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Delta write path; brings arrow/parquet/object_store/tokio/chrono. `datafusion` is
# needed for DeltaTable::merge (transactional upsert by key), which is how incremental
# sync applies new and changed rows without hand-rolling Delta's file-rewrite logic.
# Mirrors tiberiusdelta's own deliberate exception to "minimal dependency surface": see
# CLAUDE.md's Dependency budget.
deltalake = { version = "0.32.4", features = ["datafusion"] }

# Pinned exactly, for the same reason tiberiusdelta pins it: 1.2.0 removed the
# `parse_column_name!` macro deltalake's kernel dependency requires without a semver-major
# bump, breaking the build with `datafusion` enabled.
buoyant_kernel_derive = "=1.1.0"

# Delta's async write path, plus the blocking-thread pool crate::connect and
# crate::pipeline dispatch every rsfbclient call onto (rsfbclient opens its own
# std::net::TcpStream directly; this crate's own code never needs tokio's "net" feature).
# "sync" is the mpsc channel crate::pipeline streams fetched batches through; "time" is
# the timeout wrapped around both the login and each batch (see CLAUDE.md's Open items
# for what that timeout does and does not cancel).
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "sync", "time"] }
futures = "0.3.34"

[dev-dependencies]
# `macros` only, for #[tokio::test]; the library itself never needs them.
tokio = { version = "1.53.1", features = ["macros"] }

[features]
default = []
# Links the extension module against the Python interpreter that loads it, rather than
# libpython. Enabled by the wheel build; must stay off for `cargo test`.
extension-module = ["pyo3/extension-module"]
# Cloud object stores, for the Delta *output* side. Not needed for a local path or a
# /Volumes FUSE path.
azure = ["deltalake/azure"]
gcp = ["deltalake/gcs"]
s3 = ["deltalake/s3"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
