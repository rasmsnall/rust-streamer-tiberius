name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Everything except extension-module. That feature tells pyo3 not to link libpython,
  # which is right for the wheel and fatal for a test binary, so --all-features must not
  # be used anywhere a binary is linked.
  LIB_FEATURES: azure
  # The throwaway password for the SQL Server service containers below. Local to one CI
  # run, reachable only from inside that run's network, and granting nothing anywhere
  # else; it is a fixture, not a secret. Repeated literally in each `services` block
  # rather than read from this context, because whether the env context resolves there is
  # version-dependent and an unresolved value would surface as a confusing login failure.
  #
  # The service containers deliberately declare no health check: tools/seed.py already
  # waits for the server to accept *logins*, which is the condition that matters and is
  # strictly later than accepting TCP connections. A health check would add a fragile
  # shell-quoting surface and a dependency on sqlcmd's exact path inside the image.
  MSSQL_SA_PASSWORD: Test_Passw0rd!2026

jobs:
  check:
    name: Format, lint and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version and pulls in rustfmt and clippy, so the
      # verdict here matches a developer's machine.
      - name: Show toolchain
        run: rustc --version && cargo --version && cargo fmt --version && cargo clippy --version

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --features "$LIB_FEATURES" -- -D warnings

      # Two steps, not one: cargo refuses to mix --doc with any other target selector.
      # The live tests need a database and run in their own job.
      - name: Unit tests
        run: cargo test --lib --features "$LIB_FEATURES"

      - name: Doctests
        run: cargo test --doc --features "$LIB_FEATURES"

      - name: Documentation builds without broken links
        run: cargo doc --no-deps --features "$LIB_FEATURES"
        env:
          RUSTDOCFLAGS: -D warnings

  live:
    name: End-to-end against SQL Server
    runs-on: ubuntu-latest
    services:
      # The type mapping is a property of TDS and tiberius, not of this code, so it can
      # only be verified against a real server. tests/mssql_live.rs is the gate that
      # catches a wrong mapping; without this service it would not run in CI at all.
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Test_Passw0rd!2026
        ports:
          - 14330:1433
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Seed the fixtures
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymssql
          python tools/seed.py

      - name: Live tests
        run: cargo test --test mssql_live --features "$LIB_FEATURES"

  wheel:
    name: manylinux abi3 wheel
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Test_Passw0rd!2026
        ports:
          - 14330:1433
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # azure gives the abfss:// object-store backend. There is no C toolchain or driver
      # to install: tiberius is pure Rust and speaks TDS over a plain socket, which is
      # most of why it replaced ODBC. abi3 comes from the pyo3 feature pinned in
      # Cargo.toml, so one wheel covers 3.10 and later.
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: "2_28"
          args: --release --out dist --features extension-module,azure

      - name: Verify the wheel is abi3 and imports
        run: |
          set -eux
          ls -l dist/
          # An abi3 wheel must be tagged cp310-abi3, not cp310-cp310. Without this the
          # single-artefact promise silently becomes false.
          ls dist/ | grep -q 'cp310-abi3' || { echo "wheel is not abi3"; exit 1; }
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "
          import tiberiusdelta
          print('version', tiberiusdelta.__version__)
          print('exports', sorted(tiberiusdelta.__all__))
          assert callable(tiberiusdelta.sync_tables)
          assert callable(tiberiusdelta.preflight)
          "

      # Needs the wheel installed: the distribution wrapper lives in the same package as
      # the compiled extension. No Spark and no database, so it stays fast.
      - name: Python tests
        run: |
          python -m pip install pytest
          python -m pytest tests/python -q

      - name: Sync a live table through the wheel
        run: |
          python -m pip install pymssql deltalake pyarrow tzdata
          python tools/seed.py
          python tools/smoke.py

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-manylinux-x86_64
          path: dist/*.whl
          if-no-files-found: error

  interpreters:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        # One abi3 wheel must load on every interpreter the project claims to support.
        # DBR 16.4 LTS and 17.3 LTS both ship Python 3.12.3, so one 3.12 job covers both;
        # 3.10 is the abi3 floor and 3.13 checks the forward half of the promise.
        include:
          - python: "3.10"
            label: "Python 3.10 (abi3 floor)"
          - python: "3.12"
            label: "Python 3.12 (DBR 16.4 LTS and 17.3 LTS)"
          - python: "3.13"
            label: "Python 3.13 (abi3 forward compatibility)"
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Test_Passw0rd!2026
        ports:
          - 14330:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-manylinux-x86_64
          path: dist
      - name: Install and sync
        run: |
          set -eux
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl pymssql deltalake pyarrow tzdata
          python -c "import tiberiusdelta, sys; print(sys.version); print(tiberiusdelta.__version__)"
          python tools/seed.py
          python tools/smoke.py
