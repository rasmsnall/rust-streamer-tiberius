name: firebirddelta CI

on:
  push:
    branches: [main]
    paths:
      - "firebirddelta/**"
      - ".github/workflows/firebirddelta-ci.yml"
  pull_request:
    paths:
      - "firebirddelta/**"
      - ".github/workflows/firebirddelta-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: firebirddelta

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Everything except extension-module. That feature tells pyo3 not to link libpython,
  # which is right for the wheel and fatal for a test binary, so --all-features must not
  # be used anywhere a binary is linked. Mirrors tiberiusdelta-ci's own LIB_FEATURES.
  LIB_FEATURES: azure
  # The throwaway SYSDBA password for the Firebird service containers below. Local to
  # one CI run, reachable only from inside that run's network, and granting nothing
  # anywhere else; it is a fixture, not a secret. Repeated literally in each `services`
  # block rather than read from this context, for the same reason tiberiusdelta-ci
  # repeats MSSQL_SA_PASSWORD literally: whether the env context resolves inside a
  # `services:` block is version-dependent, and an unresolved value would surface as a
  # confusing login failure rather than a clear one.
  FIREBIRD_PASSWORD: Test_Passw0rd!2026
  # Fixed by the firebirdsql/firebird image itself (its documented database directory,
  # not a configurable one), and repeated in every job that needs the source directly.
  FIREBIRD_DB_PATH: /var/lib/firebird/data/firebirddelta_test.fdb

jobs:
  check:
    name: Format, lint and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version and pulls in rustfmt and clippy, so the
      # verdict here matches a developer's machine.
      - name: Show toolchain
        run: rustc --version && cargo --version && cargo fmt --version && cargo clippy --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firebirddelta -> target

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --features "$LIB_FEATURES" -- -D warnings

      # Two steps, not one: cargo refuses to mix --doc with any other target selector.
      # The live tests need a database and run in their own job.
      - name: Unit tests
        run: cargo test --lib --features "$LIB_FEATURES"

      - name: Doctests
        run: cargo test --doc --features "$LIB_FEATURES"

      - name: Documentation builds without broken links
        run: cargo doc --no-deps --features "$LIB_FEATURES"
        env:
          RUSTDOCFLAGS: -D warnings

  live:
    name: End-to-end against Firebird
    runs-on: ubuntu-latest
    services:
      # The type mapping is a property of the Firebird wire protocol and rsfbclient, not
      # of this code, so it can only be verified against a real server; see
      # CLAUDE.md's Driver notes. tests/firebird_live.rs is the gate that catches a
      # wrong mapping. Firebird 5.0 (current stable series) so .devtest/type_zoo.sql's
      # Firebird-4+-only types (INT128, DECFLOAT, the WITH TIME ZONE types) exist.
      firebird:
        image: firebirdsql/firebird:5.0.4
        env:
          FIREBIRD_DATABASE: firebirddelta_test.fdb
          FIREBIRD_ROOT_PASSWORD: Test_Passw0rd!2026
        ports:
          - 3050:3050
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firebirddelta -> target

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # firebird-driver wraps the native fbclient library via ctypes, unlike this
      # crate's own driver-free rsfbclient pure_rust backend (see CLAUDE.md's
      # Dependency budget); it is a dev-tooling dependency only, needed here so
      # tools/seed.py can talk to the service container, not something the wheel ships.
      - name: Install the Firebird client library for the seeding tool
        run: sudo apt-get update && sudo apt-get install -y libfbclient2

      - name: Seed the fixtures
        run: |
          python -m pip install --upgrade pip
          python -m pip install firebird-driver
          python tools/seed.py 127.0.0.1 3050 "$FIREBIRD_DB_PATH"

      - name: Live tests
        run: cargo test --test firebird_live --features "$LIB_FEATURES"

  wheel:
    name: manylinux abi3 wheel
    runs-on: ubuntu-latest
    services:
      firebird:
        image: firebirdsql/firebird:5.0.4
        env:
          FIREBIRD_DATABASE: firebirddelta_test.fdb
          FIREBIRD_ROOT_PASSWORD: Test_Passw0rd!2026
        ports:
          - 3050:3050
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # No C toolchain or driver to install: rsfbclient's pure_rust backend speaks
      # Firebird's wire protocol over a plain socket, which is most of why it was chosen
      # over the native fbclient-linking backends (see CLAUDE.md). abi3 comes from the
      # pyo3 feature pinned in Cargo.toml, so one wheel covers 3.10 and later.
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: firebirddelta
          target: x86_64
          manylinux: "2_28"
          args: --release --out dist --features extension-module,azure

      - name: Verify the wheel is abi3 and imports
        run: |
          set -eux
          ls -l dist/
          # An abi3 wheel must be tagged cp310-abi3, not cp310-cp310. Without this the
          # single-artefact promise silently becomes false.
          ls dist/ | grep -q 'cp310-abi3' || { echo "wheel is not abi3"; exit 1; }
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "
          import firebirddelta
          print('version', firebirddelta.__version__)
          print('exports', sorted(firebirddelta.__all__))
          assert callable(firebirddelta.sync_tables)
          assert callable(firebirddelta.preflight)
          "

      # Needs the wheel installed: the distribution wrapper lives in the same package as
      # the compiled extension. No Spark and no database, so it stays fast.
      - name: Python tests
        run: |
          python -m pip install pytest
          python -m pytest tests/python -q

      - name: Sync a live table through the wheel
        run: |
          sudo apt-get update && sudo apt-get install -y libfbclient2
          python -m pip install firebird-driver deltalake pyarrow tzdata
          python tools/seed.py 127.0.0.1 3050 "$FIREBIRD_DB_PATH"
          python tools/smoke.py 127.0.0.1 3050 "$FIREBIRD_DB_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-manylinux-x86_64-firebirddelta
          path: firebirddelta/dist/*.whl
          if-no-files-found: error

  interpreters:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        # One abi3 wheel must load on every interpreter the project claims to support.
        # DBR 16.4 LTS and 17.3 LTS both ship Python 3.12.3, so one 3.12 job covers both;
        # 3.10 is the abi3 floor and 3.13 checks the forward half of the promise. Mirrors
        # tiberiusdelta-ci's own matrix exactly, since the abi3 promise is identical.
        include:
          - python: "3.10"
            label: "Python 3.10 (abi3 floor)"
          - python: "3.12"
            label: "Python 3.12 (DBR 16.4 LTS and 17.3 LTS)"
          - python: "3.13"
            label: "Python 3.13 (abi3 forward compatibility)"
    services:
      firebird:
        image: firebirdsql/firebird:5.0.4
        env:
          FIREBIRD_DATABASE: firebirddelta_test.fdb
          FIREBIRD_ROOT_PASSWORD: Test_Passw0rd!2026
        ports:
          - 3050:3050
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-manylinux-x86_64-firebirddelta
          path: firebirddelta/dist
      - name: Install and sync
        run: |
          set -eux
          sudo apt-get update && sudo apt-get install -y libfbclient2
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl firebird-driver deltalake pyarrow tzdata
          python -c "import firebirddelta, sys; print(sys.version); print(firebirddelta.__version__)"
          python tools/seed.py 127.0.0.1 3050 "$FIREBIRD_DB_PATH"
          python tools/smoke.py 127.0.0.1 3050 "$FIREBIRD_DB_PATH"
